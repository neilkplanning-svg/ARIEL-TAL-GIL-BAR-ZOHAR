<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

    <link rel="stylesheet" href="../css/styles.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous">

    <style>
        body.vcard-page {
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .vcard-wrap {
            max-width: 420px;
            width: 100%;
            background: linear-gradient(165deg, var(--bg-elevated, var(--bg-tertiary)) 0%, var(--bg-secondary) 100%);
            border: 1px solid var(--accent-gold-dark);
            border-top: 4px solid var(--accent-gold);
            border-radius: 6px;
            padding: 2rem 1.75rem;
            box-shadow: 0 24px 60px rgba(0,0,0,0.55);
            text-align: center;
        }
        .vcard-photo {
            width: 140px;
            height: 140px;
            margin: 0 auto 1.25rem;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--accent-gold);
            box-shadow: 0 6px 20px rgba(0,0,0,0.50);
            background: var(--bg-primary);
        }
        .vcard-photo img { width:100%; height:100%; object-fit:cover; object-position:center top; }
        .vcard-name {
            font-family: var(--font-secondary);
            color: var(--text-primary);
            font-size: 1.4rem;
            margin: 0.5rem 0 0.25rem;
            font-weight: 700;
        }
        .vcard-role {
            color: var(--accent-gold-bright);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }
        .vcard-actions {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.6rem;
            margin: 1rem 0 1.5rem;
        }
        .vcard-actions a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1rem;
            background: rgba(201,169,97,0.08);
            border: 1px solid var(--accent-gold-dark);
            border-radius: 4px;
            color: var(--text-primary) !important;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.25s ease, border-color 0.25s ease;
        }
        .vcard-actions a:hover {
            background: rgba(201,169,97,0.18);
            border-color: var(--accent-gold-bright);
        }
        .vcard-actions a i { color: var(--accent-gold); font-size: 1.05rem; width: 1.25rem; }
        .vcard-footer {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-subtle);
            letter-spacing: 0.3px;
        }
        .vcard-footer img { height: 36px; margin: 0.5rem auto 0; display:block; opacity:0.85; }
    </style>
</head>
<body class="vcard-page">
    <main class="vcard-wrap" id="main-content">
        <div class="vcard-photo">
            <img src="../images/ariel-tal.jpg"
                 alt="הרב עו״ד אריאל טל"
                 onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\&quot;fas fa-user-tie\&quot; style=\&quot;font-size:3.5rem;color:var(--accent-gold);line-height:140px;\&quot;></i>';">
        </div>
        <h1 class="vcard-name">הרב עו״ד אריאל טל</h1>
        <p class="vcard-role">שותף מייסד · רב ועורך דין</p>

        <nav class="vcard-actions" aria-label="פעולות מהירות">
            <a href="tel:+972543209765"><i class="fas fa-phone" aria-hidden="true"></i> התקשרו — 054-320-9765</a>
            <a href="mailto:a0543209765@gmail.com"><i class="fas fa-envelope" aria-hidden="true"></i> a0543209765@gmail.com</a>
            <a href="https://wa.me/972543209765" target="_blank" rel="noopener noreferrer"><i class="fab fa-whatsapp" aria-hidden="true"></i> שליחת WhatsApp</a>
            <a href="../index.html#contact"><i class="fas fa-calendar-check" aria-hidden="true"></i> תיאום פגישה</a>
        </nav>

        <div class="vcard-footer">
            משרד בוטיק לעורכי דין · ירושלים · תל אביב
            <img src="../images/LOGO.png" alt="בר-זהר ואריאל טל">
        </div>
    </main>
</body>
</html>

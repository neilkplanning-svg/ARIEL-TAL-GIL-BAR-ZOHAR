# מנטרל את עיבוד Jekyll עבור קבצי תיעוד שמכילים placeholders ({{ }})
# שגורמים לשגיאת Liquid syntax בעת build.
# גם אם Jekyll רץ למרות .nojekyll — הקבצים האלה לא ייכללו.

exclude:
  - CLAUDE.md
  - README.md
  - BRIEF.md
  - BRIEF.template.md
  - client.config.json
  - "Internal Use/"
  - .claude/
  - .gitignore
  - .github/
  - images/README.md
